name: Security audit
on:
  pull_request:
    paths: [composer.lock, package-lock.json]
  push:
    branches: [main]
    paths: [composer.lock, package-lock.json]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      # The lock file, not vendor/: nothing is installed in this job.
      - run: composer audit --locked
      - run: npm audit --audit-level=high