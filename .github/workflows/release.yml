name: Release

# Push a tag such as v0.1.0 to publish ghcr.io/<owner>/nexusdav:0.1.0 for amd64 and arm64.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml
    with:
      skip-image: true

  publish:
    name: publish
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<pre-release>]." >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/nexusdav" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile fails the build when PHP is older than 8.4.27, so a
      # stale base image stops the release on every platform.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          platforms: linux/amd64
          tags: nexusdav:release
          build-args: NEXUSDAV_VERSION=${{ steps.version.outputs.version }}

      - name: Smoke test
        run: docker/smoke-test.sh nexusdav:release

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          # A pre-release (v1.0.0-rc.1) gets only its exact tag; latest moves on stable releases only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
          flavor: |
            latest=auto

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NEXUSDAV_VERSION=${{ steps.version.outputs.version }}

      - name: Check the published PHP version
        env:
          IMAGE: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --entrypoint php "$IMAGE" \
              -r 'echo PHP_VERSION, " ", php_uname("m"), "\n"; exit(version_compare(PHP_VERSION, "8.4.27", ">=") ? 0 : 1);'
          done
