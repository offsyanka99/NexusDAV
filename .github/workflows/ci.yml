name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # The release workflow runs these checks before it publishes an image.
  workflow_call:
    inputs:
      skip-image:
        description: Skip the image job (the release workflow builds and smoke-tests its own image).
        type: boolean
        default: false

jobs:
  static:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, curl, dom, fileinfo, intl, mbstring, pdo, pdo_sqlite, sqlite, xml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint
        run: composer lint

      - name: Analyse
        run: composer analyse

  sqlite:
    name: sqlite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, curl, dom, fileinfo, intl, mbstring, pdo, pdo_sqlite, sqlite, xml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test
        run: composer test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

  pgsql:
    name: pgsql
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexusdav
          POSTGRES_PASSWORD: nexusdav
          POSTGRES_DB: nexusdav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusdav -d nexusdav"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, curl, dom, fileinfo, intl, mbstring, pdo, pdo_pgsql, pdo_sqlite, sqlite, xml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test
        run: composer test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nexusdav
          DB_USERNAME: nexusdav
          DB_PASSWORD: nexusdav

  image:
    name: image
    if: ${{ !inputs.skip-image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: docker build --pull --build-arg NEXUSDAV_VERSION="ci+${GITHUB_SHA::7}" -t nexusdav:ci .

      - name: Smoke test
        run: docker/smoke-test.sh nexusdav:ci
