name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, pgsql]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexusdav
          POSTGRES_PASSWORD: nexusdav
          POSTGRES_DB: nexusdav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusdav -d nexusdav"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, curl, dom, fileinfo, intl, mbstring, pdo, pdo_pgsql, pdo_sqlite, sqlite, xml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint
        run: composer lint

      - name: Analyse
        run: composer analyse

      - name: Test
        run: composer test
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.db == 'pgsql' && 'nexusdav' || ':memory:' }}
          DB_USERNAME: nexusdav
          DB_PASSWORD: nexusdav
