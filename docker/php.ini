; Loaded after php.ini-production, so these values win.

; Do not announce the PHP version in an X-Powered-By header.
expose_php = Off

; php.ini-production drops E, which empties $_ENV. bootstrap/app.php and
; Laravel read container variables from there as well as getenv().
variables_order = "EGPCS"

; The code in the image never changes, so OPcache does not need to check
; file times. A container restart clears the cache.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
