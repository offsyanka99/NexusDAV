; Limits for request bodies the app reads into memory: calendar and contact
; uploads and admin panel forms. Laravel answers 413 above post_max_size.
; Uploads to Files (PUT under /dav/files/) are streamed to disk and use
; Maximum upload size on the Settings page instead (NEXUSDAV_FILES_MAX_UPLOAD_MB).
post_max_size=128M
upload_max_filesize=128M
