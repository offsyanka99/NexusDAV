# NexusDAV behind nginx (1.25.1 or newer for "http2 on").
#
# 1. Replace dav.example.com with the host name in APP_URL, and point the
#    certificate paths at your certificate (for example from certbot).
# 2. nginx on the host: keep the upstream at 127.0.0.1:8080 and publish the app
#    on the loopback only, "127.0.0.1:8080:8080" in compose.yaml.
#    nginx in a container on the app's Docker network: use nexusdav:8080.
# 3. Leave TRUSTED_PROXIES unset: the default trusts loopback and the private
#    ranges that Docker networks use. List the proxy address if it is public.

upstream nexusdav {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dav.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dav.example.com;

    ssl_certificate     /etc/letsencrypt/live/dav.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dav.example.com/privkey.pem;

    # The app accepts request bodies up to 128 MB (vCards with photos,
    # events with attachments). nginx's default is 1 MB.
    client_max_body_size 128m;

    # Fallbacks for clients that start at the domain. The app answers these
    # paths too; these lines keep working when another location, such as a
    # certbot "location /.well-known/", would catch them first.
    location = /.well-known/caldav  { return 301 https://$host/dav/; }
    location = /.well-known/carddav { return 301 https://$host/dav/; }

    # proxy_pass passes every method (PROPFIND, REPORT, MKCALENDAR, ...) and
    # the Authorization header unchanged.
    location / {
        proxy_pass http://nexusdav;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Large syncs and uploads can take longer than nginx's 60 second default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Hand uploads to the app as they arrive instead of buffering them on disk.
        proxy_request_buffering off;
    }

    # Optional: add the app's request ID to the access log, so a proxy line
    # can be matched with the app's "Request" log line. In the http block:
    #   log_format nexusdav '$remote_addr [$time_local] "$request" $status '
    #                       '$body_bytes_sent $request_time rid=$upstream_http_x_request_id';
    # and here:
    #   access_log /var/log/nginx/nexusdav.access.log nexusdav;
}
