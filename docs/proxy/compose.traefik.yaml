# NexusDAV behind an existing Traefik v3 that watches Docker, with an
# entrypoint named "websecure", a certificate resolver named "letsencrypt",
# and a Docker network named "proxy". Rename those to match your Traefik.
# Copy this file next to compose.yaml, replace dav.example.com with the host
# name in APP_URL, then add this file last:
#   docker compose -f compose.yaml -f compose.postgres.yaml -f compose.traefik.yaml up -d
#
# Traefik passes every DAV method, the Host and Authorization headers and the
# X-Forwarded-* headers, and sets no request body limit by default, so the
# app's own limits apply (Maximum upload size for Files). Its entrypoints stop
# reading a request after 60 seconds by default, which cuts off a large upload:
# for big files, raise respondingTimeouts.readTimeout in Traefik's static
# configuration, e.g. --entryPoints.websecure.transport.respondingTimeouts.readTimeout=0

services:
  nexusdav:
    # Only Traefik talks to the app, so port 8080 is no longer published.
    ports: !reset []
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.nexusdav.rule=Host(`dav.example.com`)
      - traefik.http.routers.nexusdav.entrypoints=websecure
      - traefik.http.routers.nexusdav.tls.certresolver=letsencrypt
      - traefik.http.routers.nexusdav.middlewares=nexusdav-well-known
      # Fallback for clients that start at the domain; the app answers these paths too.
      # Traefik answers 301 to GET and 308 to other methods, which keeps PROPFIND a PROPFIND.
      - traefik.http.middlewares.nexusdav-well-known.redirectregex.regex=^https://([^/]+)/\.well-known/(caldav|carddav)$$
      - traefik.http.middlewares.nexusdav-well-known.redirectregex.replacement=https://$${1}/dav/
      - traefik.http.middlewares.nexusdav-well-known.redirectregex.permanent=true
      - traefik.http.services.nexusdav.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
