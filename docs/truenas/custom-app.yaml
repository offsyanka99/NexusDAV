# NexusDAV — TrueNAS SCALE custom app
#
# For TrueNAS SCALE 24.10 (Electric Eel) and later, whose Apps are Docker
# Compose under the hood: Apps > Discover Apps > Custom App (top right) >
# Install via YAML. Paste this whole file there, edit every line marked
# "CHANGE ME", then install. See docs/guide.md#installing-on-truenas-scale
# for the full walkthrough.
#
# TrueNAS's Custom App form has no separate place for environment variables
# or a .env file: this YAML is the only input, so values are written in
# directly rather than as ${VARIABLES}.
#
# Before installing:
#   1. Create a dataset for NexusDAV's data (Storage > Datasets > Add
#      Dataset), for example tank/apps/nexusdav. Keep it on a pool local to
#      this machine, not one mounted from elsewhere over the network:
#      SQLite needs a local filesystem (see the guide's Database section).
#   2. Replace every /mnt/tank/apps/nexusdav/... path below with that
#      dataset's path.
#   3. Put this behind an HTTPS reverse proxy before exposing it outside
#      your own network — for example Nginx Proxy Manager or Caddy, also
#      installable as TrueNAS SCALE apps, or one of the ready-to-use configs
#      in docs/proxy/.
#   4. A value with a space, #, :, or another YAML-special character needs
#      quotes, for example "a password: with a colon".

services:
  nexusdav:
    image: ghcr.io/offsyanka99/nexusdav:0.1.0
    restart: unless-stopped
    ports:
      - "8080:8080" # CHANGE ME if port 8080 is already used by another app
    volumes:
      - /mnt/tank/apps/nexusdav/data:/data # CHANGE ME: your dataset path
    environment:
      APP_URL: https://dav.example.com # CHANGE ME: the address clients will use
      ADMIN_EMAIL: admin@example.com # CHANGE ME
      ADMIN_PASSWORD: change-me-to-a-long-random-password # CHANGE ME, 12+ characters; remove after the first login
      # SQLite needs no extra container: good for a single NAS. For
      # PostgreSQL instead, see the commented block at the end of this file.
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database/nexusdav.sqlite
      # 568 is the UID/GID TrueNAS SCALE apps conventionally run as, and
      # becomes the owner of the dataset above.
      PUID: "568"
      PGID: "568"
      # Delete the line to use the default (debug). Use info or higher once
      # the server is running normally.
      # LOG_LEVEL: info
      # A reverse proxy on this host is trusted by default. List its address
      # here only when the proxy runs elsewhere.
      # TRUSTED_PROXIES: 192.0.2.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# --- PostgreSQL instead of SQLite --------------------------------------------
# Recommended for more than a couple of users. Replace the nexusdav
# service's `environment` block above with:
#
#     DB_CONNECTION: pgsql
#     DB_HOST: postgres
#     DB_PORT: "5432"
#     DB_DATABASE: nexusdav
#     DB_USERNAME: nexusdav
#     DB_PASSWORD: change-me-too # CHANGE ME, must match postgres below
#
# add this to the nexusdav service:
#
#     depends_on:
#       postgres:
#         condition: service_healthy
#
# and add this service next to nexusdav, under `services:`:
#
#   postgres:
#     image: postgres:17-alpine
#     restart: unless-stopped
#     volumes:
#       - /mnt/tank/apps/nexusdav/postgres:/var/lib/postgresql/data # CHANGE ME: your dataset path
#     environment:
#       POSTGRES_DB: nexusdav
#       POSTGRES_USER: nexusdav
#       POSTGRES_PASSWORD: change-me-too # CHANGE ME, must match DB_PASSWORD above
#     healthcheck:
#       test: ["CMD-SHELL", "pg_isready -U nexusdav -d nexusdav"]
#       interval: 10s
#       timeout: 5s
#       retries: 5
