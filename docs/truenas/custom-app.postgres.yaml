# NexusDAV — TrueNAS SCALE custom app (PostgreSQL)
#
# For TrueNAS SCALE 24.10 (Electric Eel) and later, whose Apps are Docker
# Compose under the hood: Apps > Discover Apps > Custom App (top right) >
# Install via YAML. Paste this whole file there, edit every line marked
# "CHANGE ME", then install. See docs/guide.md#installing-on-truenas-scale
# for the full walkthrough.
#
# Recommended for more than a couple of users. For a single NAS with light
# use, docs/truenas/custom-app.sqlite.yaml needs no extra container.
#
# TrueNAS's Custom App form has no separate place for environment variables
# or a .env file: this YAML is the only input, so values are written in
# directly rather than as ${VARIABLES}.
#
# Before installing:
#   1. Create a dataset for NexusDAV's data (Storage > Datasets > Add
#      Dataset), for example tank/apps/nexusdav, and a second one for
#      PostgreSQL's data, for example tank/apps/nexusdav/postgres. Keep both
#      on a pool local to this machine.
#   2. Replace every /mnt/tank/apps/nexusdav/... path below with your
#      dataset paths.
#   3. Put this behind an HTTPS reverse proxy before exposing it outside
#      your own network — for example Nginx Proxy Manager or Caddy, also
#      installable as TrueNAS SCALE apps, or one of the ready-to-use configs
#      in docs/proxy/.
#   4. A value with a space, #, :, or another YAML-special character needs
#      quotes, for example "a password: with a colon".

services:
  nexusdav:
    image: ghcr.io/offsyanka99/nexusdav:0.6.0
    restart: unless-stopped
    # Ceilings, not reserved amounts. One FrankenPHP process: OPcache is
    # 128 MB and a request may use up to 128 MB. Raise these if the app is
    # stopped for running out of memory during a large sync.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    ports:
      - "8080:8080" # CHANGE ME if port 8080 is already used by another app
    volumes:
      - /mnt/tank/apps/nexusdav/data:/data # CHANGE ME: your dataset path
    environment:
      APP_URL: https://dav.example.com # CHANGE ME: the address clients will use
      ADMIN_EMAIL: admin@example.com # CHANGE ME
      ADMIN_PASSWORD: change-me-to-a-long-random-password # CHANGE ME, 12+ characters; remove after the first login
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: nexusdav
      DB_USERNAME: nexusdav
      DB_PASSWORD: change-me-too # CHANGE ME, must match postgres' POSTGRES_PASSWORD below
      # 568 is the UID/GID TrueNAS SCALE apps conventionally run as, and
      # becomes the owner of the dataset above.
      PUID: "568"
      PGID: "568"
      # Delete the line to use the default (debug). Use info or higher once
      # the server is running normally.
      # LOG_LEVEL: info
      # A reverse proxy on this host is trusted by default. List its address
      # here only when the proxy runs elsewhere.
      # TRUSTED_PROXIES: 192.0.2.10
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Queue worker, needed for WebDAV-Push and nothing else. To use it, remove
  # the leading "# " from every line of this block. It runs the same image
  # in worker mode with the same dataset: no port, no migrations.
  # nexusdav-worker:
  #   image: ghcr.io/offsyanka99/nexusdav:0.6.0 # the same version as nexusdav above
  #   command: ["worker"]
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "0.5"
  #         memory: 256M
  #   volumes:
  #     - /mnt/tank/apps/nexusdav/data:/data # CHANGE ME: the same dataset path as nexusdav
  #   environment:
  #     DB_CONNECTION: pgsql
  #     DB_HOST: postgres
  #     DB_PORT: "5432"
  #     DB_DATABASE: nexusdav
  #     DB_USERNAME: nexusdav
  #     DB_PASSWORD: change-me-too # CHANGE ME: the same as DB_PASSWORD above
  #     PUID: "568" # the same as nexusdav
  #     PGID: "568"
  #   depends_on:
  #     nexusdav:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "setpriv", "--reuid=nexusdav", "--regid=nexusdav", "--init-groups", "php", "/app/artisan", "nexusdav:worker-status"]
  #     interval: 60s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  postgres:
    image: postgres:18-alpine # 17 also supported; see docs/guide.md#requirements
    restart: unless-stopped
    # shared_buffers defaults to 128 MB. 1 GB leaves room for autovacuum
    # and a sync without taking the NAS.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      # Single mount point, not .../data: 18+ images store data under a
      # major-version-specific subdirectory (e.g. /var/lib/postgresql/18/docker)
      # so pg_upgrade can run in place later. See
      # https://github.com/docker-library/postgres/pull/1259
      - /mnt/tank/apps/nexusdav/postgres:/var/lib/postgresql # CHANGE ME: your dataset path
    environment:
      POSTGRES_DB: nexusdav
      POSTGRES_USER: nexusdav
      POSTGRES_PASSWORD: change-me-too # CHANGE ME, must match DB_PASSWORD above
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusdav -d nexusdav"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# IMPORTANT — PostgreSQL data directory permissions on TrueNAS:
# This is the postgres:*-alpine image, whose "postgres" user is UID/GID 70
# (the Debian-based postgres image uses 999 instead — check with
# `docker run --rm <image> id postgres` if you change images). Before the
# first start, create the dataset and set ownership on the host:
#
#     chown -R 70:70 /mnt/tank/apps/nexusdav/postgres
#     chmod -R 0700 /mnt/tank/apps/nexusdav/postgres
#
# TrueNAS SCALE datasets default to NFSv4 ACLs, which take precedence over
# the POSIX mode bits above and are NOT removed by chown/chmod alone. If
# Postgres still fails with "Permission denied" after the commands above,
# replace the inherited ACL first, either in the UI (Datasets > Permissions >
# Edit > Strip ACL, then set owner/group 70 and apply recursively) or via
# (the bundled nfs4_setfacl has no -b/strip flag, so use -s to replace the
# whole ACL with a single owner-only entry instead):
#
#     nfs4_setfacl -R -s A::OWNER@:rwaDxtcy /mnt/tank/apps/nexusdav/postgres
#
# The directory must be empty on first launch (remove any old
# .../postgres/data from a previous PostgreSQL 17 install before switching
# to 18 — the layout changed). Without correct ownership/ACLs Postgres
# fails to start ("data directory is not writable" / "Permission denied")
# and the nexusdav container will stay waiting or unhealthy.
