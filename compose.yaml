# NexusDAV — base Compose file
# Use together with compose.postgres.yaml or compose.sqlite.yaml

services:
  nexusdav:
    # image: ghcr.io/offsyanka99/nexusdav:latest   # will be defined later
    build: .
    container_name: nexusdav
    ports:
      - "8080:8080"
    volumes:
      - nexusdav_data:/data
    environment:
      - APP_URL=${APP_URL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-*}
      - PUID=${PUID:-568}
      - PGID=${PGID:-568}
      # Empty when unset, so the entrypoint can drop it and keep the config default.
      - LOG_LEVEL=${LOG_LEVEL-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  nexusdav_data:
