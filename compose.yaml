# NexusDAV — base Compose file
# Use together with compose.postgres.yaml or compose.sqlite.yaml

services:
  nexusdav:
    # image: ghcr.io/offsyanka99/nexusdav:latest   # will be defined later
    # build: .
    container_name: nexusdav
    ports:
      - "8080:8080"
    volumes:
      - nexusdav_data:/data
    environment:
      - APP_URL=${APP_URL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  nexusdav_data:
