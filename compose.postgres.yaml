# PostgreSQL override
# Usage: docker compose -f compose.yaml -f compose.postgres.yaml up -d

services:
  nexusdav:
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-nexusdav}
      - DB_USERNAME=${DB_USERNAME:-nexusdav}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: nexusdav-postgres
    environment:
      - POSTGRES_DB=${DB_DATABASE:-nexusdav}
      - POSTGRES_USER=${DB_USERNAME:-nexusdav}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nexusdav} -d ${DB_DATABASE:-nexusdav}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
